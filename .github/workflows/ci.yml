name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit version
        run: moon version --all
      - name: Format check
        run: moon fmt --check
      - name: Generate interfaces
        run: moon info
      - name: Type check
        run: moon check --deny-warn
      - name: Build
        run: moon build
      - name: Tests
        run: moon test
      - name: Build JavaScript generator CLI
        run: moon check --target js --deny-warn
      - name: Generate MQTT example project
        run: moon run cmd/main --target js -- examples/temperature.json _build/e2e-temperature generated/temperature
      - name: Check generated MQTT project
        working-directory: _build/e2e-temperature
        run: moon check --deny-warn
      - name: Generate Kafka example project
        run: moon run cmd/main --target js -- examples/order-events.json _build/e2e-orders generated/orders
      - name: Check generated Kafka project
        working-directory: _build/e2e-orders
        run: moon check --deny-warn
